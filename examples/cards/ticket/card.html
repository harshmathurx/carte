<style data-proof>

<style>

</style>
</head>
<body>
<section data-face="front">
<div class="card front"> <div class="band"></div> <div class="stub"></div> <div class="hole" style="right:130px;top:70px"></div> <div class="hole" style="right:130px;top:190px"></div> <div class="hole" style="right:130px;top:310px"></div> <div class="title">ADMIT ONE</div> <div class="sub">Midway Attraction &amp; Sideshow</div> <div class="row row1">NAME&nbsp;&nbsp;Sammy Ferris</div> <div class="row row2">ROLE&nbsp;&nbsp;Carnival Barker</div> <div class="row row3">HANDLE&nbsp;@sammyferris</div> <div class="stubtext">NO REFUNDS</div> <div class="no">No. 0417</div> </div>
</section>
