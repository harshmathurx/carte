<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="scrollodex:orientation" content="landscape">
<meta name="scrollodex:finish" content="emboss">
<meta name="scrollodex:background" content="#f4f0e6">
<meta name="scrollodex:summary" content="A bone-white card with the name in raised serif letters that cast a faint embossed shadow, a small monogram in an oval border, and understated uppercase role text. The back lists the firm and desk in mono type over the same paper grain.">


<!-- PROOF SCAFFOLD. Left out when published; the app ships these same fonts. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda&family=IBM+Plex+Mono&family=Playfair+Display&display=swap">
<style data-proof>
  body{margin:0;min-height:100vh;display:flex;flex-wrap:wrap;gap:40px;align-items:center;justify-content:center;padding:48px;box-sizing:border-box;background:#e8e4dc}
  [data-face]{flex:none;box-shadow:0 1px 2px rgba(0,0,0,.08),0 24px 48px -24px rgba(0,0,0,.35);border-radius:14px}
  [data-face]::after{content:attr(data-face);position:absolute;top:100%;left:0;margin-top:10px;font:12px/1 system-ui;letter-spacing:.08em;text-transform:uppercase;color:#777}
  @media (prefers-color-scheme:dark){body{background:#1c1b18}}
  @media (max-width:800px){body{zoom:.5}}
</style>

<style>
[data-face]{position:relative;width:700px;height:400px;overflow:hidden;background:#f4f0e6}
[data-face]{background:#F4F0E6;color:#17160F;font-family:"Bodoni Moda","Playfair Display",serif}.card{position:absolute;inset:0;padding:46px 54px;box-sizing:border-box;overflow:hidden}.grain{position:absolute;inset:0;opacity:.45;background-image:radial-gradient(rgba(23,22,15,.05) 1px,transparent 1px),radial-gradient(rgba(23,22,15,.03) 1px,transparent 1px);background-size:5px 5px,7px 7px}.mark{position:absolute;right:54px;top:46px;width:50px;height:50px}.name{position:absolute;left:54px;bottom:148px;font-size:46px;letter-spacing:.04em;text-shadow:0 1px 0 rgba(255,255,255,.6),0-1px 1px rgba(23,22,15,.25)}.rule{position:absolute;left:54px;right:54px;bottom:132px;height:1px;background:rgba(23,22,15,.2)}.role{position:absolute;left:56px;bottom:96px;font-family:"Bodoni Moda",serif;font-size:15px;letter-spacing:.18em;text-transform:uppercase;color:#4A4636}.firm{position:absolute;left:56px;bottom:66px;font-family:"Bodoni Moda",serif;font-size:14px;letter-spacing:.1em;color:#4A4636}.handle{position:absolute;left:56px;bottom:40px;font-family:"IBM Plex Mono",monospace;font-size:12px;color:#8A8570}.back .line{position:absolute;left:54px;right:54px;font-family:"IBM Plex Mono",monospace;font-size:14px;color:#17160F}.back .l1{top:150px}.back .l2{top:180px}.back .l3{top:210px}.back .k{color:#8A8570;display:inline-block;width:92px}.back .quote{position:absolute;left:54px;right:54px;bottom:48px;font-size:20px;font-style:italic;color:#4A4636}
</style>
</head>
<body>
<section data-face="front">
<div class="grain"></div>
<div class="card front"> <div class="mark"> <svg viewBox="0 0 50 50" role="img" aria-label="A monogram of interlocked letters in a raised oval border"> <ellipse cx="25" cy="25" rx="23" ry="23" fill="none" stroke="#17160F" stroke-width="1"></ellipse> <text x="25" y="33" font-size="24" text-anchor="middle" fill="#17160F" font-family="serif">PB</text> </svg> </div> <div class="name">Patrick Bexley</div> <div class="rule"></div> <div class="role">Vice President</div> <div class="firm">Pierce &amp; Pierce, New York</div> <div class="handle">@pbexley</div> </div>
</section>
<section data-face="back">
<div class="grain"></div>
<div class="card back"> <div class="grain"></div> <div class="line l1"><span class="k">firm</span>Pierce &amp; Pierce</div> <div class="line l2"><span class="k">desk</span>Mergers &amp; Acquisitions, 40th Fl.</div> <div class="line l3"><span class="k">handle</span>@pbexley</div> <div class="quote">Look at that subtle off-white coloring.</div> </div>
</section>
</body>
</html>
