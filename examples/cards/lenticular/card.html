<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="scrollodex:orientation" content="landscape">
<meta name="scrollodex:finish" content="gloss">
<meta name="scrollodex:background" content="#101018">
<meta name="scrollodex:summary" content="A dark card ruled with diagonal striped bands that suggest depth, a layered diamond mark, and bold sans-serif name. The back repeats the stripes at a different angle to imply parallax.">


<!-- PROOF SCAFFOLD. Left out when published; the app ships these same fonts. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono&family=Inter:wght@400;500;600;700&family=Space+Grotesk&display=swap">
<style data-proof>
  body{margin:0;min-height:100vh;display:flex;flex-wrap:wrap;gap:40px;align-items:center;justify-content:center;padding:48px;box-sizing:border-box;background:#e8e4dc}
  [data-face]{flex:none;box-shadow:0 1px 2px rgba(0,0,0,.08),0 24px 48px -24px rgba(0,0,0,.35);border-radius:14px}
  [data-face]::after{content:attr(data-face);position:absolute;top:100%;left:0;margin-top:10px;font:12px/1 system-ui;letter-spacing:.08em;text-transform:uppercase;color:#777}
  @media (prefers-color-scheme:dark){body{background:#1c1b18}}
  @media (max-width:800px){body{zoom:.5}}
</style>

<style>
[data-face]{position:relative;width:700px;height:400px;overflow:hidden;background:#101018}
[data-face]{background:#101018;color:#F1F1F6;font-family:"Space Grotesk","Archivo Black",sans-serif}.card{position:absolute;inset:0;padding:42px 50px;box-sizing:border-box;overflow:hidden}.stripes{position:absolute;inset:0;background:repeating-linear-gradient(100deg,#1B1C2B 0 10px,#23243A 10px 20px,#171826 20px 30px)}.depth{position:absolute;inset:0;background:repeating-linear-gradient(100deg,rgba(255,255,255,.08)0 4px,transparent 4px 30px);animation:slide 5s linear infinite}@keyframes slide{0%{transform:translateX(0)}100%{transform:translateX(60px)}}.mark{position:absolute;right:50px;top:42px;width:60px;height:60px}.name{position:absolute;left:50px;bottom:122px;font-size:50px;font-weight:700;letter-spacing:-.02em}.role{position:absolute;left:52px;bottom:88px;font-family:"Inter",sans-serif;font-size:15px;color:#9EA0BE}.handle{position:absolute;left:52px;bottom:46px;font-family:"IBM Plex Mono",monospace;font-size:13px;color:#6D6F92}.rule{position:absolute;left:50px;right:50px;bottom:76px;height:1px;background:rgba(241,241,246,.14)}.back .stripes2{position:absolute;inset:0;background:repeating-linear-gradient(80deg,#171826 0 12px,#23243A 12px 24px)}.back .depth2{position:absolute;inset:0;background:repeating-linear-gradient(80deg,rgba(255,255,255,.06)0 3px,transparent 3px 24px);animation:slide2 6s linear infinite}@keyframes slide2{0%{transform:translateX(0)}100%{transform:translateX(-48px)}}.back .line{position:absolute;left:50px;right:50px;font-family:"IBM Plex Mono",monospace;font-size:14px;color:#F1F1F6}.back .l1{top:150px}.back .l2{top:180px}.back .l3{top:210px}.back .k{color:#6D6F92;display:inline-block;width:92px}.back .quote{position:absolute;left:50px;right:50px;bottom:46px;font-size:20px;font-style:italic;color:#9EA0BE}
</style>
</head>
<body>
<section data-face="front">
<div class="card front"> <div class="stripes"></div> <div class="depth"></div> <div class="mark"> <svg viewBox="0 0 60 60" role="img" aria-label="Three layered diamonds suggesting depth"> <path d="M30 6 L52 30 L30 54 L8 30 Z" fill="none" stroke="#F1F1F6" stroke-width="1.4" opacity=".5"></path> <path d="M30 16 L44 30 L30 44 L16 30 Z" fill="none" stroke="#F1F1F6" stroke-width="1.4" opacity=".75"></path> <path d="M30 24 L38 30 L30 36 L22 30 Z" fill="#F1F1F6"></path> </svg> </div> <div class="name">Dex Ferro</div> <div class="rule"></div> <div class="role">Lenticular Print Artist</div> <div class="handle">@dexferro</div> </div>
</section>
<section data-face="back">
<div class="card back"> <div class="stripes2"></div> <div class="depth2"></div> <div class="line l1"><span class="k">studio</span>Ferro Optics Lab</div> <div class="line l2"><span class="k">practice</span>Two images, one card, an illusion of motion</div> <div class="line l3"><span class="k">handle</span>@dexferro</div> <div class="quote">Tilt the card. Watch it move.</div> </div>
</section>
</body>
</html>
