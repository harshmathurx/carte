<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="scrollodex:orientation" content="landscape">
<meta name="scrollodex:finish" content="matte">
<meta name="scrollodex:background" content="#04140a">
<meta name="scrollodex:summary" content="A black card lit entirely in phosphor green, with scanlines, a typing whoami command with a blinking block cursor, and a root shell prompt. The back repeats the scanline texture with a shell and practice line.">


<!-- PROOF SCAFFOLD. Left out when published; the app ships these same fonts. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&family=VT323&display=swap">
<style data-proof>
  body{margin:0;min-height:100vh;display:flex;flex-wrap:wrap;gap:40px;align-items:center;justify-content:center;padding:48px;box-sizing:border-box;background:#e8e4dc}
  [data-face]{flex:none;box-shadow:0 1px 2px rgba(0,0,0,.08),0 24px 48px -24px rgba(0,0,0,.35);border-radius:14px}
  [data-face]::after{content:attr(data-face);position:absolute;top:100%;left:0;margin-top:10px;font:12px/1 system-ui;letter-spacing:.08em;text-transform:uppercase;color:#777}
  @media (prefers-color-scheme:dark){body{background:#1c1b18}}
  @media (max-width:800px){body{zoom:.5}}
</style>

<style>
[data-face]{position:relative;width:700px;height:400px;overflow:hidden;background:#04140a}
[data-face]{background:#04140A;color:#39FF7A;font-family:"VT323","IBM Plex Mono",monospace}.card{position:absolute;inset:0;padding:34px 40px;box-sizing:border-box;overflow:hidden}.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(57,255,122,.05)0 2px,transparent 2px 4px)}.glow{position:absolute;inset:0;box-shadow:inset 0 0 60px rgba(57,255,122,.15)}.type{position:absolute;left:40px;top:40px;right:40px;font-size:22px;line-height:1.5;white-space:pre;overflow:hidden;border-right:12px solid #39FF7A;width:26ch;animation:typing 3.5s steps(26) infinite,caret .8s steps(1) infinite}@keyframes typing{0%,15%{width:0}70%,100%{width:26ch}}@keyframes caret{0%,49%{border-color:#39FF7A}50%,100%{border-color:transparent}}.prompt{position:absolute;left:40px;bottom:110px;font-size:18px;color:#1FA555}.role{position:absolute;left:40px;bottom:78px;font-size:20px}.handle{position:absolute;left:40px;bottom:44px;font-size:16px;color:#1FA555}.cursor2{display:inline-block;width:10px;height:16px;background:#39FF7A;animation:blink2 1s steps(1) infinite;vertical-align:middle;margin-left:4px}@keyframes blink2{0%,49%{opacity:1}50%,100%{opacity:0}}.back .scan2{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(57,255,122,.05)0 2px,transparent 2px 4px)}.back .line{position:absolute;left:40px;right:40px;font-size:20px;color:#39FF7A}.back .l1{top:150px}.back .l2{top:182px}.back .l3{top:214px}.back .k{color:#1FA555;display:inline-block;width:110px}.back .quote{position:absolute;left:40px;right:40px;bottom:44px;font-size:20px;color:#1FA555}
</style>
</head>
<body>
<section data-face="front">
<div class="scan"></div>
<div class="glow"></div>
<div class="card front"> <div class="type">&gt; whoami_</div> <div class="prompt">root@carte:~$</div> <div class="role">Odessa Kade — Systems Hacker</div> <div class="handle">@0dessa<span class="cursor2"></span></div> </div>
</section>
<section data-face="back">
<div class="scan"></div>
<div class="glow"></div>
<div class="card back"> <div class="scan2"></div> <div class="line l1"><span class="k">shell</span>zsh, tmux, one green terminal</div> <div class="line l2"><span class="k">practice</span>Reverse engineering, old protocols</div> <div class="line l3"><span class="k">handle</span>@0dessa</div> <div class="quote">&gt; connection established.</div> </div>
</section>
</body>
</html>
