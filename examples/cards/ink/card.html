<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="scrollodex:orientation" content="landscape">
<meta name="scrollodex:finish" content="matte">
<meta name="scrollodex:background" content="#f6f2e9">
<meta name="scrollodex:summary" content="A warm bone-paper card with a single curving brush-ink stroke in the corner and the name written in flowing script. The back has a small red ink seal and a large handwritten quote.">


<!-- PROOF SCAFFOLD. Left out when published; the app ships these same fonts. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat&family=Cormorant:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono&family=Pinyon+Script&display=swap">
<style data-proof>
  body{margin:0;min-height:100vh;display:flex;flex-wrap:wrap;gap:40px;align-items:center;justify-content:center;padding:48px;box-sizing:border-box;background:#e8e4dc}
  [data-face]{flex:none;box-shadow:0 1px 2px rgba(0,0,0,.08),0 24px 48px -24px rgba(0,0,0,.35);border-radius:14px}
  [data-face]::after{content:attr(data-face);position:absolute;top:100%;left:0;margin-top:10px;font:12px/1 system-ui;letter-spacing:.08em;text-transform:uppercase;color:#777}
  @media (prefers-color-scheme:dark){body{background:#1c1b18}}
  @media (max-width:800px){body{zoom:.5}}
</style>

<style>
[data-face]{position:relative;width:700px;height:400px;overflow:hidden;background:#f6f2e9}
[data-face]{background:#F6F2E9;color:#1B1812;font-family:"Pinyon Script","Caveat",cursive}.card{position:absolute;inset:0;padding:44px 52px;box-sizing:border-box;overflow:hidden}.wash{position:absolute;inset:0;background:radial-gradient(circle at 85% 15%,rgba(27,24,18,.05),transparent 55%)}.brush{position:absolute;right:44px;top:36px;width:150px;height:150px}.name{position:absolute;left:48px;bottom:128px;font-size:72px;line-height:1;color:#16130E}.role{position:absolute;left:54px;bottom:90px;font-family:"Cormorant",serif;font-size:17px;font-style:italic;color:#4A4436}.handle{position:absolute;left:54px;bottom:48px;font-family:"IBM Plex Mono",monospace;font-size:13px;color:#7A7360}.stroke{position:absolute;left:52px;right:52px;bottom:76px;height:6px}.back .line{position:absolute;left:52px;right:52px;font-family:"IBM Plex Mono",monospace;font-size:14px;color:#1B1812}.back .l1{top:150px}.back .l2{top:180px}.back .l3{top:210px}.back .k{color:#948C74;display:inline-block;width:92px}.back .quote{position:absolute;left:52px;right:52px;bottom:48px;font-size:34px;font-family:"Pinyon Script",cursive;color:#2A2620}.back .seal{position:absolute;right:60px;bottom:46px;width:46px;height:46px}
</style>
</head>
<body>
<section data-face="front">
<div class="wash"></div>
<div class="card front"> <div class="brush"> <svg viewBox="0 0 150 150" role="img" aria-label="A single brush-ink stroke curving like a wave"> <path d="M18 100 C 40 40, 90 20, 120 40 C 96 46, 70 68, 66 100 C 84 88, 108 84, 130 96" fill="none" stroke="#1B1812" stroke-width="7" stroke-linecap="round" opacity=".85"></path> <circle cx="118" cy="112" r="3" fill="#1B1812" opacity=".5"></circle> </svg> </div> <div class="name">Kaito Mori</div> <svg class="stroke" viewBox="0 0 600 12" preserveAspectRatio="none" role="presentation"> <path d="M2 6 C 150 2, 300 10, 598 5" fill="none" stroke="#1B1812" stroke-width="3" opacity=".7"></path> </svg> <div class="role">Calligrapher &amp; Ink Maker</div> <div class="handle">@kaitomori</div> </div>
</section>
<section data-face="back">
<div class="wash"></div>
<div class="card back"> <div class="seal"> <svg viewBox="0 0 46 46" role="img" aria-label="A small red ink seal square"> <rect x="2" y="2" width="42" height="42" fill="#8E2A22" opacity=".85"></rect> <text x="23" y="30" font-size="18" fill="#F6F2E9" text-anchor="middle" font-family="serif">森</text> </svg> </div> <div class="line l1"><span class="k">studio</span>Mori Ink Atelier, Kyoto</div> <div class="line l2"><span class="k">practice</span>Sumi ink, brush lessons, one stroke a day</div> <div class="line l3"><span class="k">handle</span>@kaitomori</div> <div class="quote">One breath, one line.</div> </div>
</section>
</body>
</html>
